name: Ingestion RSS

on:
  schedule:
    # Ogni 10 minuti, sfalsati dagli scatti tondi. Non e' avidita': misurato
    # sulle prime otto ore, lo scheduler gratuito ha onorato 3 slot su 15. Con
    # sei occasioni all'ora ne resta comunque una ogni 45-60 minuti.
    # Sostenibile per gli editori grazie alle richieste condizionali, e per il
    # repo dati perche' un run a vuoto non produce piu' alcun commit.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

# Il GITHUB_TOKEN non deve scrivere niente: sul repo dati si scrive con la
# deploy key, su questo repo non si scrive affatto.
permissions:
  contents: read

# Due run sovrapposti si contenderebbero il push sul repo dati.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Checkout del repo dati
        uses: actions/checkout@v4
        with:
          repository: andrus98/personal-feed-data
          path: data-repo
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Dipendenze
        run: pip install -r ingest/requirements.txt

      # Gli ETag dei feed. Stanno qui e non nel repo dati perche' sono metadati
      # effimeri: committarli a ogni run sarebbe churn puro. Se la cache si
      # perde, il run successivo riscarica tutto e la ricostruisce.
      - name: Cache dei validatori HTTP
        uses: actions/cache@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      # Prima di scrivere: se la normalizzazione e' rotta, meglio un run fallito
      # che uno shard di articoli sbagliati committato per sempre.
      - name: Selftest
        run: python ingest/selftest.py

      - name: Ingestion
        run: python ingest/ingest.py --data-dir data-repo

      - name: Commit e push sul repo dati
        working-directory: data-repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessun articolo nuovo: niente da committare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ingestion $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
