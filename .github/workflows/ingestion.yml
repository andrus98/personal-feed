name: Ingestion RSS

on:
  schedule:
    # Tre volte l'ora, sfalsate dagli scatti tondi. Non e' modestia, e' la
    # misura: con sei occasioni all'ora lo scheduler gratuito ne onorava una su
    # dieci, cioe' un run ogni ora e tre quarti. La frequenza alta non comprava
    # niente, e metteva il repo fra quelli che sotto carico hanno piu' ragioni
    # di essere sacrificati.
    #
    # La storia, perche' ricostruirla costa caro. Il 26/08 alle 14:25 UTC lo
    # schedule si e' fermato: non un run fallito, nessun run innescato affatto,
    # workflow "active", ventitre su ventitre verdi. Era cominciato con
    # l'incidente Actions del 26 (15:02-17:40 UTC, failover del primary del
    # database), ma non e' ripartito quando l'incidente era chiuso da nove ore,
    # e gli eventi schedule persi non vengono rigiocati. Tre push sul branch di
    # default non hanno ri-armato niente - e Actions li aveva visti tutti e tre,
    # perche' ognuno ha acceso il deploy di Pages: ventitre ore dopo, ancora
    # zero run da schedule.
    #
    # Per questo il file si chiama ingestion.yml e non piu' ingest.yml: un file
    # nuovo e' un workflow nuovo per GitHub, quindi una registrazione dello
    # schedule nuova. E' l'ipotesi rimasta, e questo file e' l'esperimento.
    #
    # Se il feed si ferma di nuovo, il primo numero da guardare e' quanti run
    # sono stati innescati: zero significa GitHub, non l'ingestion. E se non
    # riparte piu' da solo, dentro Actions non resta niente di affidabile:
    # servirebbe un trigger esterno che chiami repository_dispatch.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

# Il GITHUB_TOKEN non deve scrivere niente: sul repo dati si scrive con la
# deploy key, su questo repo non si scrive affatto.
permissions:
  contents: read

# Due run sovrapposti si contenderebbero il push sul repo dati.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Checkout del repo dati
        uses: actions/checkout@v4
        with:
          repository: andrus98/personal-feed-data
          path: data-repo
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Dipendenze
        run: pip install -r ingest/requirements.txt

      # Gli ETag dei feed. Stanno qui e non nel repo dati perche' sono metadati
      # effimeri: committarli a ogni run sarebbe churn puro. Se la cache si
      # perde, il run successivo riscarica tutto e la ricostruisce.
      - name: Cache dei validatori HTTP
        uses: actions/cache@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      # Prima di scrivere: se la normalizzazione e' rotta, meglio un run fallito
      # che uno shard di articoli sbagliati committato per sempre.
      - name: Selftest
        run: python ingest/selftest.py

      - name: Ingestion
        run: python ingest/ingest.py --data-dir data-repo

      - name: Commit e push sul repo dati
        working-directory: data-repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessun articolo nuovo: niente da committare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ingestion $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
